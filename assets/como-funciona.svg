<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de uso do MergePdf</title>
  <desc id="description">Quatro passos: escolher imagens ou PDFs, arrastar para ordenar, escolher o destino e criar o PDF em A4.</desc>
  <rect width="1200" height="360" rx="28" fill="#121826"/>
  <text x="600" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Como criar ou mesclar um PDF</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(55 110)">
      <rect width="235" height="180" rx="20" fill="#1e293b" stroke="#c90000" stroke-width="3"/>
      <circle cx="117" cy="52" r="28" fill="#c90000"/>
      <text x="117" y="61" fill="#ffffff" font-size="28" font-weight="700">1</text>
      <text x="117" y="113" fill="#ffffff" font-size="20" font-weight="700">Escolha os arquivos</text>
      <text x="117" y="143" fill="#cbd5e1" font-size="15">imagens ou PDFs</text>
    </g>
    <path d="M300 200 H330" stroke="#c90000" stroke-width="6" stroke-linecap="round"/>
    <path d="M322 187 L340 200 L322 213" fill="none" stroke="#c90000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(345 110)">
      <rect width="235" height="180" rx="20" fill="#1e293b" stroke="#c90000" stroke-width="3"/>
      <circle cx="117" cy="52" r="28" fill="#c90000"/>
      <text x="117" y="61" fill="#ffffff" font-size="28" font-weight="700">2</text>
      <text x="117" y="113" fill="#ffffff" font-size="20" font-weight="700">Arraste para ordenar</text>
      <text x="117" y="143" fill="#cbd5e1" font-size="15">mova com o mouse</text>
    </g>
    <path d="M590 200 H620" stroke="#c90000" stroke-width="6" stroke-linecap="round"/>
    <path d="M612 187 L630 200 L612 213" fill="none" stroke="#c90000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(635 110)">
      <rect width="235" height="180" rx="20" fill="#1e293b" stroke="#c90000" stroke-width="3"/>
      <circle cx="117" cy="52" r="28" fill="#c90000"/>
      <text x="117" y="61" fill="#ffffff" font-size="28" font-weight="700">3</text>
      <text x="117" y="113" fill="#ffffff" font-size="20" font-weight="700">Defina o destino</text>
      <text x="117" y="143" fill="#cbd5e1" font-size="15">escolha nome e pasta</text>
    </g>
    <path d="M880 200 H910" stroke="#c90000" stroke-width="6" stroke-linecap="round"/>
    <path d="M902 187 L920 200 L902 213" fill="none" stroke="#c90000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(925 110)">
      <rect width="220" height="180" rx="20" fill="#c90000"/>
      <circle cx="110" cy="52" r="28" fill="#a50000"/>
      <text x="110" y="61" fill="#ffffff" font-size="28" font-weight="700">4</text>
      <text x="110" y="113" fill="#ffffff" font-size="20" font-weight="700">Salve o PDF</text>
      <text x="110" y="143" fill="#ffffff" font-size="15">confirme o caminho</text>
    </g>
  </g>
</svg>
